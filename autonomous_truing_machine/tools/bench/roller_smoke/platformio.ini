; Standalone bench sketch for the roller wheel drive -- DevKit + TMC2209 + NEMA 17 + roller -- with
; no orchestrator, no session, no WiFi. It compiles the REAL src/wheel_drive_tmc2209.c and the
; lib/truing_hal step ramp and TMC2209 framing (not reimplementations), so what the bench measures
; is the code the firmware image runs. Stages R1-R4 of docs/ROLLER_BENCH.md are driven from it.
;
; Nothing moves on boot: the driver starts DISABLED and every motion is a keystroke. Drive it with
; tools/bench/roller_ctl.py, which logs your notes next to the board's replies.
;
;     pio run -d "$env:USERPROFILE\truing_roller\autonomous_truing_machine\tools\bench\roller_smoke" -e s3_bench_roller
;     ... -t upload --upload-port COM4       (DevKit: ordinary upload; the CH343 bridge handles reset)
;
; DevKit only. Never COM5 -- that is the Nano, and the acoustic campaign's.

[env:s3_bench_roller]
platform = espressif32@6.10.0
framework = espidf
board = esp32-s3-devkitc-1-n16r8v
monitor_speed = 115200
monitor_port = COM4
upload_port = COM4
