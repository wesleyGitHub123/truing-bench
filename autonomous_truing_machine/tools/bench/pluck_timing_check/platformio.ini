; T6 harness for the hardware-timed pulse fix (88b6b8b) -- compiles the REAL src/pluck_gpio.c
; (not a reimplementation) and fires it under synthetic scheduler pressure at the same task
; priorities the real firmware uses, to answer the one thing that change's own commit could not
; establish host-side: does the pulse actually stop stretching under load.
;
; Deliberately NOT the release firmware and does not flip PRESENT: PRESENT=1 is gated on that
; station passing B2, and this harness exists precisely to get T6 evidence without touching that
; gate. No orchestrator, no session, no WiFi -- just the driver, fired directly, under load.
;
;     pio run -d "$env:USERPROFILE\truing_ws\tools\bench\pluck_timing_check" -e nano_pluck_timing
;
; Flash per docs/DEV_NOTES.md's Nano rule: never `-t upload`. Write bootloader (0x0), partitions (0x8000)
; and firmware (0x10000) from .pio/build/nano_pluck_timing with esptool.

[env:nano_pluck_timing]
platform = espressif32@6.10.0
framework = espidf
board = arduino_nano_esp32
monitor_speed = 115200
monitor_port = COM5
