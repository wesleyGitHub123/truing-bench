; T6 harness for the hardware-timed pulse fix (88b6b8b) -- compiles the REAL src/pluck_gpio.c
; (not a reimplementation) and fires it under synthetic scheduler pressure at the same task
; priorities the real firmware uses, to answer the one thing that change's own commit could not
; establish host-side: does the pulse actually stop stretching under load. Also drives B2-E3
; (campaign plan): 200 fires quiet and 200 under load, per channel, measured widths logged.
;
; Deliberately NOT the release firmware and does not flip PRESENT: PRESENT=1 is gated on that
; station passing B2, and this harness exists precisely to get T6 evidence without touching that
; gate. No orchestrator, no session, no WiFi -- just the driver, fired directly.
;
; Four envs, one per channel x {loaded, quiet} (campaign plan Amendment 1: B2-E3 needs both
; channels; E3 itself needs both conditions per channel) -- same harness, GPIO and load-task
; presence set via build_flags. GPIO numbers per SOLENOID_CAMPAIGN.md's rig registry /
; board_nano_esp32.h.
;
;     pio run -d "$env:USERPROFILE\truing_ws\tools\bench\pluck_timing_check" -e nano_pluck_timing_left
;     pio run -d "$env:USERPROFILE\truing_ws\tools\bench\pluck_timing_check" -e nano_pluck_timing_left_quiet
;     pio run -d "$env:USERPROFILE\truing_ws\tools\bench\pluck_timing_check" -e nano_pluck_timing_right
;     pio run -d "$env:USERPROFILE\truing_ws\tools\bench\pluck_timing_check" -e nano_pluck_timing_right_quiet
;
; Flash per docs/DEV_NOTES.md's Nano rule: never `-t upload`. Write bootloader (0x0), partitions (0x8000)
; and firmware (0x10000) from .pio/build/<env> with esptool.

[env]
platform = espressif32@6.10.0
framework = espidf
board = arduino_nano_esp32
monitor_speed = 115200
monitor_port = COM5

[env:nano_pluck_timing_left]
build_flags = -DTEST_GPIO=9 -DCHANNEL_NAME=\"LEFT\"

[env:nano_pluck_timing_left_quiet]
build_flags = -DTEST_GPIO=9 -DCHANNEL_NAME=\"LEFT\" -DPLUCK_TIMING_QUIET=1

[env:nano_pluck_timing_right]
build_flags = -DTEST_GPIO=10 -DCHANNEL_NAME=\"RIGHT\"

[env:nano_pluck_timing_right_quiet]
build_flags = -DTEST_GPIO=10 -DCHANNEL_NAME=\"RIGHT\" -DPLUCK_TIMING_QUIET=1
