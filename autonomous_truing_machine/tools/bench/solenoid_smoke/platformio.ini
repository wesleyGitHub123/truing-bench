; Standalone bench sketch - drives both solenoid driver channels, with no acoustic or
; orchestrator code around them.
;
; Deliberately NOT part of the release image matrix: no board_profile.h, no chain profile,
; no provenance. Its only job is "does each channel fire its own solenoid" before the real
; firmware is asked to. Build through the existing junction (this folder lives under
; autonomous_truing_machine, so the space-in-path problem does not apply):
;
;     pio run -d "$env:USERPROFILE\truing_ws\tools\bench\solenoid_smoke" -e nano_bench_solenoid
;     pio run -d "$env:USERPROFILE\truing_ws\tools\bench\solenoid_smoke" -e s3_bench_solenoid
;
; nano_bench_solenoid drives GPIO 9 (D6) / GPIO 10 (D7) -- that board died to a wiring mistake
; 2026-09-27. s3_bench_solenoid drives GPIO 15 / GPIO 21, the acoustic front end's new home
; (board_s3_devkit.h's BOARD_PLUCK_ACTUATOR_LEFT/RIGHT_GPIO). Check `pio device list` for the
; DevKit's actual port before flashing -- a second S3 DevKitC-1 (the roller campaign's, fixed at
; COM4) may be attached at the same time, and this sketch's own upload_port would otherwise
; silently target the wrong board.
;
; Flash the Nano env per docs/DEV_NOTES.md's Nano rule: never `-t upload`. Write bootloader (0x0),
; partitions (0x8000) and firmware (0x10000) from .pio/build/nano_bench_solenoid with esptool.
; The DevKit env uploads the ordinary way (`-t upload`); its bridge handles reset.

[env:nano_bench_solenoid]
platform = espressif32@6.10.0
framework = espidf
board = arduino_nano_esp32
monitor_speed = 115200
monitor_port = COM5

[env:s3_bench_solenoid]
platform = espressif32@6.10.0
framework = espidf
board = esp32-s3-devkitc-1-n16r8v
monitor_speed = 115200
build_flags = -DLEFT_GPIO=15 -DRIGHT_GPIO=21
; No upload_port/monitor_port pinned: confirm the port with `pio device list` first (see above)
; and pass --upload-port explicitly, since COM4 is the roller board's, not necessarily this one's.
