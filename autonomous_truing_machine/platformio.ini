; PlatformIO project configuration — Automated Bicycle Wheel Truing System firmware.
;
; SPEC §4.2: PlatformIO + ESP-IDF, BOTH board environments defined from day one
; and both must remain buildable at all times. The shared base lives in
; [esp_base]; each board environment extends it and adds its board-profile flag
; (SPEC §4.3: all pin assignments live in one board-profile header per board).
;
; The `native` environment runs the framework-free core (SPEC §3 P3) host-side
; unit tests: `pio test -e native`.
;
; BUILD PATH NOTE: PlatformIO's ESP-IDF integration refuses build paths that
; contain spaces. This project lives under a path with spaces, so ESP-IDF
; builds run through a space-free directory junction (see docs/BUILD.md):
;     pio run -d "$env:USERPROFILE\truing_ws" -e s3_devkit
; Host tests (`native`) are unaffected and run from either path.

[platformio]
default_envs = s3_devkit
test_dir = test

[esp_base]
; Pinned to the official espressif32 platform (this machine also has a fork
; registered under the same short name; pinning makes resolution deterministic).
platform = espressif32@6.10.0
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
; An existing sdkconfig.<env> silently outranks a CHANGED value in sdkconfig.defaults,
; and those generated files are gitignored, so two boards can be built from what looks
; like one configuration and not be. This fails the build instead (see the script).
extra_scripts =
    pre:tools/check_sdkconfig.py
    pre:tools/build_identity.py
build_flags =
    -Wall
    -Wextra

[env:s3_devkit]
; Development target (SPEC §4.1): ESP32-S3-DevKitC-1, N16R8 (16 MB flash, 8 MB PSRAM)
extends = esp_base
board = esp32-s3-devkitc-1-n16r8v
build_flags = ${esp_base.build_flags} -DBOARD_PROFILE_S3_DEVKIT
upload_port = COM4
monitor_port = COM4

[env:s3_devkit_provision]
; Bring-up variant: writes the SYNTHETIC fixture configuration into NVS so the
; persistence path (SPEC §11.5) can be verified across a reboot with the plain
; s3_devkit image. Never a demonstration configuration.
extends = env:s3_devkit
build_flags = ${env:s3_devkit.build_flags} -DTRUING_BRINGUP_PROVISION_FIXTURE_CONFIG=1

[env:s3_devkit_selfplay]
; The unattended on-target evidence run: the auto-operator starts the session and answers
; its own waits, which is what docs/BRINGUP_LOG.md records. The plain s3_devkit image is
; interactive and waits for a person, so this is a separate image rather than a mode.
extends = env:s3_devkit
build_flags = ${env:s3_devkit.build_flags} -DTRUING_SELF_PLAY=1

[env:s3_devkit_mic]
; The interactive image with the PHYSICAL INMP441 front end: the real microphone over I2S
; (SPEC 9.3/9.4), opened once at boot and drained continuously; each spoke measurement
; captures a bounded window of real audio for the existing DSP, excited by the solenoid at the
; spoke's own acoustic station. No hand-pluck path: sessions are refused until the board profile
; declares both stations' solenoids (BOARD_PLUCK_ACTUATOR_*_PRESENT). The estimate stays
; suspect / PROVISIONAL_MODE_ID (SPEC 4.4.1): real acquisition is not validated measurement.
extends = env:s3_devkit
build_flags = ${env:s3_devkit.build_flags} -DTRUING_REAL_FRONT_END=1

[env:s3_devkit_fastdemo]
; Accelerated DEMONSTRATION image: the operator still presses Start and still applies every
; adjustment, but navigation and runout are the SYNTHETIC implementations, so the repetitive
; acquisition runs without a human. The substitution happens before truing_orch_init(), so
; session admission records TRUING_SOURCE_SYNTHETIC and every provenance answer says so.
; Never a physical-wheel result; see src/build_mode.h.
extends = env:s3_devkit
build_flags = ${env:s3_devkit.build_flags} -DTRUING_FAST_DEMO=1

[env:s3_devkit_fastdemo_mic]
; ACOUSTIC DEMONSTRATION: the fast demo's synthetic runout with the PHYSICAL INMP441 front end.
; A few spokes (TRUING_ACOUSTIC_DEMO_SPOKES) are struck by the station solenoids on the real microphone to show
; that the acquisition path works; the remaining tension rows are left uncollected because the
; active solver layout is TENSION_ABSENT and does not contain them. The orchestrator refuses the
; bound under any layout that uses tension, so this can never starve a solve.
extends = env:s3_devkit
build_flags = ${env:s3_devkit.build_flags} -DTRUING_FAST_DEMO=1 -DTRUING_REAL_FRONT_END=1

[env:nano_esp32]
; Final form-factor target (SPEC §4.1): Arduino Nano ESP32
extends = esp_base
board = arduino_nano_esp32
build_flags = ${esp_base.build_flags} -DBOARD_PROFILE_NANO

[env:nano_esp32_selfplay]
; The same unattended evidence run on the final form-factor board.
extends = env:nano_esp32
build_flags = ${env:nano_esp32.build_flags} -DTRUING_SELF_PLAY=1

[env:nano_esp32_mic]
; The same physical-INMP441 front-end image on the final form-factor board (board profile
; records the validated D2/D3/D4 wiring).
extends = env:nano_esp32
build_flags = ${env:nano_esp32.build_flags} -DTRUING_REAL_FRONT_END=1

[env:nano_esp32_fastdemo]
; The accelerated demonstration image on the final form-factor board.
extends = env:nano_esp32
build_flags = ${env:nano_esp32.build_flags} -DTRUING_FAST_DEMO=1

[env:nano_esp32_fastdemo_mic]
; The acoustic demonstration on the final form-factor board — the one the INMP441 is wired to.
; This is the demo image: a few real solenoid strikes, synthetic runout, real solver. Refuses
; sessions until both stations' solenoids are declared in the board profile.
extends = env:nano_esp32
build_flags = ${env:nano_esp32.build_flags} -DTRUING_FAST_DEMO=1 -DTRUING_REAL_FRONT_END=1

[env:nano_esp32_fastdemo_mic_campaign]
; Campaign bench variant of the acoustic demonstration: the same wiring as nano_esp32_fastdemo_mic
; above, plus the debug channel (TRUING_CAMPAIGN_DEBUG, SPEC 12.5) so MEASURE_ONCE can drive a
; single station capture outside a session for bench characterization
; (docs/SOLENOID_CAMPAIGN.md). The demo image above never carries this flag.
extends = env:nano_esp32
build_flags = ${env:nano_esp32.build_flags} -DTRUING_FAST_DEMO=1 -DTRUING_REAL_FRONT_END=1 -DTRUING_CAMPAIGN_DEBUG=1

[env:native]
; Host-side unit tests for the framework-free core, HAL contracts and simulations.
platform = native
build_flags = -Wall -Wextra -DTRUING_HOST_BUILD
test_build_src = no
; test_acoustic_sweep is a deliberate diagnostic, not a regression -- it walks ~15 DSP
; settings across every capture bundle and takes tens of seconds. Keep it out of `-e native`
; (T2); run it as `-e native_sweep`.
test_ignore = test_acoustic_sweep

[env:native_sweep]
; DSP parameter sweep over captured audio, for the acoustic retune (SPEC 9.5). Prints a CSV
; of n_peaks / f1 / f2 / snr per (bundle, parameter, value); asserts nothing. Point it at a
; harvest with TRUING_SWEEP_DIR=... (tools/campaign_recorder.py writes one with an index.txt).
extends = env:native
test_ignore =
test_filter = test_acoustic_sweep
